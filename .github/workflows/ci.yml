name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Run tests
        run: CI=true yarn test --watchAll=false

      # Type checking happens here via react-scripts' bundled fork-ts-checker,
      # not a standalone `tsc --noEmit` — the project's pinned TS 4.1.5 can't
      # parse @mui/material's newer .d.ts syntax on its own, but the webpack
      # plugin handles it fine.
      - name: Build
        run: CI=false yarn build
